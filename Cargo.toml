[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/rousseau/guioxide"

[workspace.dependencies]
guioxide-geom = { path = "crates/guioxide-geom" }
guioxide-data = { path = "crates/guioxide-data" }
guioxide-bids = { path = "crates/guioxide-bids" }
guioxide-view = { path = "crates/guioxide-view" }

# Crates « cœur » sans Burn, épinglés par rev (docs/architecture.md).
medoxide-core = { git = "https://github.com/rousseau/medoxide", rev = "6f06a05a5c7e3ff65115c0bebb39d1e1232263dd" }
gyroxide-io = { git = "https://github.com/rousseau/gyroxide", rev = "298a7ce91f669e80411061d6a8239f880c08d302" }
surfoxide-core = { git = "https://github.com/rousseau/surfoxide", rev = "dc02bf7a24ae8e2dd0aec24ae5b16001c6392fb3" }
surfoxide-io = { git = "https://github.com/rousseau/surfoxide", rev = "dc02bf7a24ae8e2dd0aec24ae5b16001c6392fb3" }

eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui-wgpu = "0.37"
egui_extras = "0.37"
egui_plot = "0.38"
rfd = "0.17"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
pollster = "1"
thiserror = "2"

[profile.dev.package."*"]
# Les dépendances (wgpu, egui) optimisées même en dev : l'interface reste fluide en debug.
opt-level = 2

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/rousseau/guioxide"

[workspace.dependencies]
guioxide-geom = { path = "crates/guioxide-geom" }
guioxide-data = { path = "crates/guioxide-data" }
guioxide-bids = { path = "crates/guioxide-bids" }
guioxide-view = { path = "crates/guioxide-view" }

# Crates « cœur » sans Burn, épinglés par rev (docs/architecture.md).
medoxide-core = { git = "https://github.com/rousseau/medoxide", rev = "f2fbcb68be1d6e12b8ad4c1e0a34c8f1dc6f942f" }
surfoxide-core = { git = "https://github.com/rousseau/surfoxide", rev = "fd2e0590f35b31f8b6dc7903c6e89995769fccee" }
surfoxide-io = { git = "https://github.com/rousseau/surfoxide", rev = "fd2e0590f35b31f8b6dc7903c6e89995769fccee" }

eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui-wgpu = "0.37"
egui_extras = "0.37"
egui_plot = "0.38"
rfd = "0.17"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
pollster = "1"
thiserror = "2"

[profile.dev.package."*"]
# Les dépendances (wgpu, egui) optimisées même en dev : l'interface reste fluide en debug.
opt-level = 2
